<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>¿Voy a entrenar hoy?</h1>
        <p id="response"></p>
        <img src="logo.png" height="120px" alt="Logo">
    </div>
</body>
<script>
    const day = new Date().getDay();
    console.log(day);
    document.getElementById("response").textContent = (day === 1 || day === 3) ? 'Sí' : 'No';
</script>
</html>
