<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pench.cc</title>
    <link rel="stylesheet" href="style.css">
    <meta name="theme-color" content="#111111">
</head>
<body>
    <main class="home">
        <h1>Hola</h1>
        <p class="message">No sé qué hacer con esta página aún</p>
        <p class="alias-line">
            Si quieren transferirme plata, mi alias también es
            <button class="alias" type="button" aria-label="Copiar alias pench.cc">pench.cc</button>
            <span class="copy-status" role="status" aria-live="polite"></span>
        </p>
    </main>
    <script>
        const aliasButton = document.querySelector('.alias');
        const copyStatus = document.querySelector('.copy-status');

        aliasButton.addEventListener('click', async () => {
            try {
                await navigator.clipboard.writeText('pench.cc');
                copyStatus.textContent = 'Copiado';
                window.setTimeout(() => {
                    copyStatus.textContent = '';
                }, 1600);
            } catch {
                copyStatus.textContent = 'No se pudo copiar';
            }
        });
    </script>
</body>
</html>
